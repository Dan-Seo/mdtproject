name: ci

# main의 기본 CI. review.yml의 verify는 PR 이벤트 전용이라 main 자체가 깨진 사실을
# 잡지 못한다 — 여기서 잡는다. 이 워크플로가 실패하면 oncall.yml이 깨어난다 (사고 대응).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_failure:
        description: 'oncall 사고 대응 경로 실검증 — 이 실행을 의도적으로 실패시킨다'
        type: boolean
        default: false
      fixable:
        description: 'force_failure 와 함께: oncall 이 재현 가능한 결함을 심어 수정·재검증·PR 경로까지 밟는다'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 연속 push 시 이전 실행을 취소한다

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # oncall.yml 은 ci 가 실패해야만 깨어나므로, main 이 한 번도 안 깨진 지금까지
      # 사고 대응 경로가 통째로 미검증이다 (전 실행 skipped). 그 경로를 안전하게
      # 밟기 위한 스위치다 — push 에서는 inputs 가 비어 있어 항상 건너뛴다.
      #
      # 실패 내용은 아무거나가 아니라 scripts/ci/ 의 로그 처리 세 갈래를 정조준한다.
      #  1) 800 줄 초과 → distill-failure-log.sh 의 축약 분기 (600 꼬리 + 시그니처)
      #  2) `error TS####` → 꼬리 밖 오류 줄을 건져내는 grep 시그니처
      #  3) 더미 PEM → scrub-secrets.sh 의 BEGIN/END 마스킹. 축약이 먼저 돌면 그 사이가
      #     잘려 BEGIN 을 잃은 본문이 마스킹되지 않고 남는다 (PR #41 3차 리뷰의 major).
      #     그 순서 수정이 여태 실전에서 검증된 적이 없다.
      - name: oncall 경로 실검증용 의도적 실패
        if: ${{ inputs.force_failure }}
        # 줄 배치가 이 테스트의 전부다. PEM 을 로그 앞쪽에 두면 축약 때 통째로 중략 구간에
        # 들어가 순서를 뒤집어도 아무것도 안 샌다 — 즉 아무것도 검증하지 못한다.
        # BEGIN 은 꼬리 600 줄 **밖**, 본문 일부는 꼬리 **안**에 걸치게 배치해야
        # 「BEGIN 을 잃은 본문이 마스킹되지 않고 남는」 그 고장이 재현된다.
        # 로컬 실측(같은 배치): scrub→distill 잔존 0 줄 / distill→scrub 잔존 19 줄.
        run: |
          echo "=== 이것은 oncall 실검증용 의도적 실패입니다. 코드 결함이 아닙니다. ==="
          echo "src/domain/rebar/measurement.ts(42,5): error TS2322: Type 'string' is not assignable to type 'number'."
          for i in $(seq 1 400); do echo "  at Object.<anonymous> (/home/runner/work/mdtproject/node_modules/head/$i.js:1:1)"; done
          # PEM 헤더를 런타임에 조립한다 — 리터럴로 두면 pre-commit 시크릿 훅이 막는다
          # (그 훅이 맞다). 로그에 찍히는 문자열은 동일해 마스킹 검증에는 영향이 없다.
          B='-----BEGIN PRIVATE'; E='-----END PRIVATE'
          echo "$B KEY-----"
          for i in $(seq 1 40); do echo "ZmFrZWtleWZha2VrZXlmYWtla2V5ZmFrZWtleQ$i"; done
          echo "$E KEY-----"
          for i in $(seq 1 580); do echo "  at Object.<anonymous> (/home/runner/work/mdtproject/node_modules/tail/$i.js:1:1)"; done
          echo "src/domain/model/project.ts(117,3): error TS2345: Argument of type 'Rebar' is not assignable."
          echo "npm error Lifecycle script typecheck failed with exit code 1"
          # fixable 모드 표식. 이 가짜 실패는 재현이 안 돼 oncall 이 항상 「분석만」으로
          # 끝나므로, 수정·재검증·푸시·PR 경로가 통째로 미검증으로 남는다. 이 표식을 본
          # oncall 이 워크스페이스에 진짜 타입 오류를 하나 심어 그 경로를 끝까지 밟는다.
          # **꼬리에 찍어야 한다** — distill 이 무조건 보존하는 구간은 마지막 600줄이다.
          if [ "${{ inputs.fixable }}" = "true" ]; then echo "ONCALL_DRILL_SEED"; fi
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # 게이트·리뷰 파이프라인의 결정적 검증. npm test 는 vitest 라 node:test 로 쓴
      # .claude/workflows/review-code.test.js 도, scripts/ci/*.spec.sh 도 잡지 않는다 —
      # 자동 승인·머지를 좌우하는 코드가 CI 에서 한 번도 안 돌고 있었다 (PR #41 리뷰의 major).
      - run: npm run test:ci-scripts

      # 머지 게이트 판정의 상세 실패 모드(커밋 불일치·작성자 위조·마커 파손·다중 마커)는
      # pytest 가 덮고 review-verdict.spec.sh 는 계약의 뼈대만 본다. 여기에 연결하지 않으면
      # fail-closed 경로가 회귀해도 CI 가 초록으로 지나간다 (PR #41 4차 리뷰의 major).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --quiet pytest
      - run: python -m pytest scripts/ -q
      - run: npm run build
      # three が `/` の遮断経路に戻っていないか (ADR-024 §5)。Lighthouse 予算は
      # これを通してしまう — 転送量が動かないからだ。build 直後にしか見られない。
      - run: node scripts/perf/blocking-graph.mjs

      # 브라우저 실측 회귀 게이트. PR CI(review.yml의 verify)에는 넣지 않는다 — PR은
      # 그대로 빠르게 두고, 회귀는 머지 후 여기서 잡아 oncall이 깨어나게 한다.
      # 예산과 그 근거는 lighthouserc.cjs에 있다. 게이트는 러너 속도와 무관한 값에만 걸려 있다.
      # 별도 워크플로로 빼지 않는 이유: oncall.yml이 `workflow_run: [ci]`만 보므로
      # 여기 있어야 회귀가 사고 대응으로 이어진다.
      - run: npm run lighthouse

      # 예산까지 남은 **여유**를 잡 요약에 적는다. 게이트는 통과/실패만 말해서 번들이
      # 예산 코앞까지 자라도 안 보인다 — 실제로 script 가 300,249 → 314,550 B 로 자라
      # 여유가 450 B(0.14%)만 남은 것을 여섯 번의 초록불 동안 아무도 못 봤다.
      # 여기서 실패시키지는 않는다. 판정은 lighthouserc.cjs 의 error 예산 몫이다.
      - name: 예산 여유 보고
        if: always()
        run: node scripts/perf/report.mjs

      # 실패했을 때 어떤 예산이 왜 깨졌는지 보려면 리포트가 필요하다 — 성공 시에도 남겨
      # 다음 최적화의 기준선으로 쓴다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          # 없으면 아무것도 안 올라간다 — upload-artifact v4 는 점으로 시작하는 숨김
          # 경로를 기본 제외한다. lhci 가 「Dumping 3 reports to disk」를 찍은 뒤에도
          # 「No files were found with the provided path: .lighthouseci/」가 뜨고
          # 잡은 그대로 초록이라, 리포트가 한 번도 안 올라간 사실이 가려져 있었다
          # (run 32226110435 에서 확인). 성능 기준선이 여기 하나뿐이라 치명적이다.
          include-hidden-files: true
          retention-days: 14
