name: autoresearch

# 결정적 성능 지표 하나를 언덕오르기하는 루프. karpathy/autoresearch 구조를 가져왔다 —
# 고정 하네스가 지표를 정하고, 에이전트는 수정 대상만 건드리고, 좋아졌으면 유지·아니면 폐기.
#
# 이 저장소가 이 구조에 특히 맞는 이유는 **지표를 게이밍할 수 없기 때문**이다.
# tests/golden/ 이 규준 표 값을 칸 단위로 못 박고 있어서, 계산을 빠르게 하려고 수치를
# 건드리면 즉시 터진다. 「빠르게 하되 답은 바꾸지 마라」가 코드로 강제된다.
#
# 지표는 lighthouserc.cjs 의 **error 예산 중 결정적인 것**뿐이다 — 전송 바이트와 요청 수.
# 타이밍(performance·TBT·LCP)은 러너에 GPU 가 없어 실행마다 수십 % 흔들리므로 언덕오르기
# 대상이 될 수 없다. 노이즈를 개선으로 착각해 밤새 쓰레기를 커밋하게 된다.
# 바이트가 결정적이라는 것은 실측으로 확인했다 — 3회 실행이 428148/314550 로 완전히 동일.
#
# 착수 시점의 사정: script 여유 450 B(0.14%), total 1,852 B(0.43%). 2026-08-12 대비
# script 가 14,301 B 늘었다. 이 루프의 첫 일은 그 증가분을 되돌리는 것이다.
#
# **사람은 머지 결정 한 곳에만 남는다.** 이 워크플로는 draft PR 만 연다 —
# review.yml 의 gate 는 oncall/* 만 자동 머지에서 뺐으므로, 브랜치 이름을 oncall/ 로
# 시작하게 해 같은 보호를 받는다.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: '최대 반복 횟수 (1회당 편집+빌드+lighthouse+테스트 ≈ 3분)'
        type: string
        default: '6'
  schedule:
    # 주 1회 일요일 18:00 UTC (월요일 03:00 KST). 매일 돌리지 않는 이유는 비용이다 —
    # 1회 반복이 에이전트 턴 + 3분 CI 이고, 매일이면 월 $300~600 대가 된다.
    - cron: '0 18 * * 0'

concurrency:
  group: autoresearch
  cancel-in-progress: false # 진행 중인 루프를 새 실행이 죽이지 않는다

jobs:
  optimize:
    runs-on: ubuntu-latest
    # 벽시계 상한. 반복 상한과 별개로 반드시 있어야 한다 — 에이전트가 한 반복에서
    # 오래 헤매면 반복 수만으로는 안 막힌다.
    timeout-minutes: 90
    permissions:
      contents: write # oncall/perf-* 브랜치 푸시
      pull-requests: write # draft PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 기준선. 에이전트가 아니라 여기서 잰다 — 시작값을 에이전트가 만들면
      # 「개선」의 정의가 에이전트 손에 들어간다.
      - name: 기준선 측정
        run: |
          npm run build
          npm run lighthouse || true   # 예산 초과여도 계속한다 — 지금 값을 알아야 한다
          node scripts/perf/report.mjs
          cp -r .lighthouseci .lighthouseci-baseline

      - name: 언덕오르기 (헤드리스 에이전트)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            너는 이 저장소의 성능 최적화 루프다. 목표는 **초기 로드 전송 바이트를 줄이는 것** 하나다.

            지표 (이것만이 성공 기준이다):
            - `resource-summary:script:size` — 낮을수록 좋다. 현재 예산 315,000 B
            - `resource-summary:total:size` — 낮을수록 좋다. 현재 예산 430,000 B
            기준선은 `.lighthouseci-baseline/` 에 있다. `node scripts/perf/report.mjs .lighthouseci-baseline` 로 읽어라.

            반복 (최대 ${{ inputs.iterations || 6 }}회):
            1. 바이트를 줄일 가설을 하나 세운다. 가장 큰 덩어리부터 본다 —
               `npm run build` 출력의 First Load JS 와 `.next/static/chunks/` 크기를 보라.
               three.js·exceljs 처럼 무거운 의존을 초기 로드에서 지연 로드로 미는 것이 1순위다.
            2. 고친다.
            3. `npm run build && LHCI_RUNS=1 npm run lighthouse || true` 후 `node scripts/perf/report.mjs` 로 잰다.
               LHCI_RUNS=1 을 꼭 붙여라 — 기본 3회는 타이밍 중앙값용이고 바이트는 1회로 충분하다 (3배 빠르다).
            4. **좋아졌고 `npm test` 가 통과하면 유지**한다. 아니면 그 변경을 되돌리고 다음 가설로 간다.
               되돌릴 때는 `git checkout -- <파일>` 을 쓴다.
            5. 유지한 변경이 있으면 다음 반복으로. 없으면 3회 연속 실패 시 멈춘다.

            건드리면 안 되는 것 (지표를 고치는 것은 최적화가 아니라 게이밍이다):
            - `lighthouserc.cjs` — 예산 자체
            - `tests/**`, `evals/**` — 정답을 고정하는 하네스
            - `src/rulepack/**` — 규준 수치
            - `.github/workflows/**` — GITHUB_TOKEN 으로 푸시할 수 없다
            - `package.json` 의 dependencies 에서 무언가를 지우는 것. 지연 로드로 미는 것은 되고,
              기능을 없애 바이트를 줄이는 것은 안 된다.

            CLAUDE.md 를 지켜라. 특히 src/domain 은 순수 TS 이고 React·three.js 를 import 하지 않는다.

            마지막에 `.autoresearch/report.md` 를 써라:
            - 1행: `perf(범위): 한 줄 요약` ← conventional commit. PR 제목으로 쓴다
            - `## 무엇을 줄였나` — 지표 before/after 를 바이트로. 추정치 금지, 실측만
            - `## 어떻게` — 반복별로 무엇을 시도했고 무엇을 유지·폐기했는지
            - `## 위험` — 지연 로드로 미룬 것이 사용자에게 언제 보이는지
            개선이 하나도 없으면 변경을 전부 되돌리고 보고서에 그렇게 써라. 억지로 만들지 마라.

            금지: git commit·push, gh 사용 — 브랜치·커밋·PR 은 워크플로가 만든다.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git checkout:*),Bash(ls:*),Bash(du:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(sort:*)"

      - name: 실행 로그 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoresearch-log-${{ github.run_id }}
          path: /home/runner/work/_temp/claude-execution-output.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: 개선 여부 판정
        id: changed
        run: |
          if [ -n "$(git status --porcelain -- . ':!.autoresearch' ':!.lighthouseci' ':!.lighthouseci-baseline')" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 에이전트의 자기 보고를 믿지 않는다. 지표는 여기서 다시 잰다.
      - name: 개선 재측정
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm run lint
          npm test
          npm run build
          rm -rf .lighthouseci
          npm run lighthouse || true
          node scripts/perf/report.mjs

      - name: draft PR
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="oncall/perf-${{ github.run_id }}"   # oncall/ 접두사라 gate 의 자동 머지에서 빠진다
          TITLE=$(head -n1 .autoresearch/report.md 2>/dev/null | sed -E 's/^#+ *//')
          [ -n "$TITLE" ] || TITLE="perf: autoresearch 자동 최적화 (run ${{ github.run_id }})"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "$BRANCH"
          git add -A -- . ':!.autoresearch' ':!.lighthouseci' ':!.lighthouseci-baseline'
          git commit -m "$TITLE"
          git push origin "$BRANCH"
          {
            echo "> [!IMPORTANT]"
            echo "> autoresearch 자동 최적화 — 머지는 사람이 판단한다. 지표는 워크플로가 재측정했다."
            echo
            tail -n +2 .autoresearch/report.md 2>/dev/null || echo "(보고서 없음)"
          } > body.md
          gh pr create --draft --base main --head "$BRANCH" --title "$TITLE" --body-file body.md

      - name: 개선 없음 기록
        if: steps.changed.outputs.changed != 'true'
        run: |
          echo "### autoresearch — 이번 회차는 개선을 찾지 못했다" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,80p' .autoresearch/report.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
