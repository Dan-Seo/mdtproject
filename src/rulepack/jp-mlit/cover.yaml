# 表5.3.6 の「柱、梁、耐力壁」行 — 耐震壁は構造上の耐力壁なので柱・梁と同じ行を引く。
# 同表はもう一方に「スラブ、耐力壁以外の壁」行（仕上げあり20・仕上げなし30）を持ち、
# 分かれ目は壁が耐力壁かどうかである。雑壁を扱うようになったらそちらの行が要る —
# 耐震壁の値で代用してはならない。

