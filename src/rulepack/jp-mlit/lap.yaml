# 5.3.4(3)(ｱ) — 耐力壁だけが持つ下限。柱・梁の主筋と違い、表5.3.2 の値をそのまま
# 使わず「40d と表5.3.2 のうち大きい方」を取る。max を取る計算は TS 側の仕事で、
# ここが持つのは下限値そのものだけである (ADR-002)。
#
# 原文は「40d (軽量コンクリートの場合は50d)」と括弧で軽量コンクリートを分けるが、
# 製品はコンクリート種別の入力を持たない。表5.3.6 注1 が同じ理由でかぶり厚さを
# 普通コンクリート限定としており、この製品は既にその前提の上に立っている —
# 軽量の 50d は入力ができるまで載せない。載せれば消費者のない行になる。

- key: lap.wall.minimum
  label: 耐力壁の鉄筋の重ね継手長さの下限（普通コンクリート）
  expr: 40d（表5.3.2 の値と比べて大きい方を取る）
  conditions: {}
  value: 40
  unit: d
  source: { ref: spec, section: 5.3.4(3)(ｱ), page: 28 }
  confidence: transcribed
  note: 原文転写（転写者＝承認者・独立検討待ち R6）。「特記がなければ、耐力壁の鉄筋の重ね継手の長さは、40d（軽量コンクリートの場合は50d）又は表5.3.2 の重ね継手の長さのうちいずれか大きい値とする」
