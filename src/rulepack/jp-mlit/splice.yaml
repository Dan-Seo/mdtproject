# 公共建築数量積算基準 第4編第3章第2節 — 継手箇所数の求め方と、継手方式ごとの
# 設計長さへの算入。ここにあるのは「何か所あるものとするか」であって、重ね継手
# そのものの長さ（L1・L1h）は標準仕様書5章＝ lap.yaml が持つ。

# 1通則4) — 単独梁の通し筋や、区分の定めがない鉄筋がこれによる。
# 径ごとに行を分けるのは、条件照合が等値だけで範囲を書けないからである
# （unit-mass.yaml が径を並べているのと同じ）。

- key: measure.splice.interval
  label: 継手箇所数を求める長さの単位（径13㎜以下）
  expr: 6.0m ごとに1か所
  conditions: { size: D10 }
  value: 6000
  unit: mm
  source: { ref: quantity, section: 第4編第3章第2節 1通則4), page: 15 }
