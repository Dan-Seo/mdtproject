# 継手1か所を設計長さにどれだけ算入するか。重ね継手長さ（lap.L1）に掛ける倍率で、
# 0 なら質量は変わらず箇所数だけが残る。

- key: measure.splice.length.factor
  label: 継手1か所あたりに設計長さへ算入する重ね継手長さの倍率（重ね継手）
  expr: 重ね継手長さ × 1
  conditions: { method: 重ね継手 }
  value: 1
  unit: ratio
  source: { ref: quantity, section: 第4編第3章第2節 1通則5)・6), page: 15 }
  confidence: inferred
  note: 算入を明示した条文はない。1通則5) がガス圧接継手に限って「長さの変化はないものとする」と定め、1通則6) が重ね継手長さの決め方を定めることから、重ね継手は箇所数分の重ね長さが設計長さに入ると解した — 反対解釈であって明文ではない (R2)

- key: measure.splice.length.factor
  label: 継手1か所あたりに設計長さへ算入する重ね継手長さの倍率（ガス圧接）
  expr: 長さの変化なし
  conditions: { method: ガス圧接 }
  value: 0
  unit: ratio
  source: { ref: quantity, section: 第4編第3章第2節 1通則5), page: 15 }
  confidence: transcribed
  note: 「ガス圧接継手の加工のための鉄筋の長さの変化はないものとする」

- key: measure.splice.length.factor
  label: 継手1か所あたりに設計長さへ算入する重ね継手長さの倍率（機械式）
  expr: 長さの変化なし
  conditions: { method: 機械式 }
  value: 0
  unit: ratio
  source: { ref: quantity, section: 第4編第3章第2節 1通則4)・5), page: 15 }
  confidence: inferred
  note: 1通則4)・5) は重ね継手とガス圧接継手だけを名指す。機械式継手は長さの変化がない点でガス圧接に準じ、箇所数も1通則4)に準じると解した — 明文はない (R2)

- key: measure.splice.length.factor
  label: 継手1か所あたりに設計長さへ算入する重ね継手長さの倍率（溶接）
  expr: 長さの変化なし
  conditions: { method: 溶接 }
  value: 0
  unit: ratio
  source: { ref: quantity, section: 第4編第3章第2節 1通則4)・5), page: 15 }
  confidence: inferred
  note: 1通則4)・5) は重ね継手とガス圧接継手だけを名指す。溶接継手は長さの変化がない点でガス圧接に準じ、箇所数も1通則4)に準じると解した — 明文はない (R2)

# 2（５）壁1)② — 耐震壁の縦筋。値は 2（２）柱2) の「各階ごとに1か所」と同じだが、
# 条文が別なので行を分ける。まとめると片方が改定されたときにもう片方が巻き添えで
# 動く。横筋はここに行を持たない — 同じ条文が明示的に 1通則4) へ戻すので
# measure.splice.interval（径ごとの 6.0m/7.0m）がそのまま効く。

- key: measure.splice.wall.vertical
  label: 耐震壁 縦筋の継手箇所数
  expr: 各階に1か所
  conditions: {}
  value: 1
  unit: 箇所
  source: { ref: quantity, section: 第4編第3章第2節 2（５）壁1)②, page: 17 }
  confidence: transcribed
  note: 「縦筋の継手は原則として各階に１か所あるものとし、開口部腰壁、手すり壁等の継手はないものとする」。但書の「開口部腰壁、手すり壁等」は開口部を扱わない現状では対象がない (1通則8) は deferred)

# 2（４）床板2) — 連続する床板の全長にわたる主筋。梁の （３）梁2) と同じ形だが
