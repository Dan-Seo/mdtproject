# 2（２）柱2) — 各階柱の全長にわたる主筋。基礎柱の但書（3.0m以上で1か所）は
# 基礎を扱わないので載せない (ADR-005)。

- key: measure.splice.column
  label: 各階柱の全長にわたる主筋の継手箇所数
  expr: 各階ごとに1か所
  conditions: {}
  value: 1
  unit: 箇所
  source: { ref: quantity, section: 第4編第3章第2節 2（２）柱2), page: 16 }
  confidence: transcribed
  note: 「その他の階の各階柱の全長にわたる主筋については各階ごとに１か所の継手があるものとする」

# 2（３）梁2) — 連続する梁の全長にわたる主筋。1通則4) を「かかわらず」で上書きする。
# 区分は band の昇順で判定し、上限（.band.upper）未満ならその区分。上限を持たない
# 区分が最後の区分である。

- key: measure.splice.girder.continuous
  label: 連続する梁の全長にわたる主筋の継手箇所数（5.0m未満）
  expr: 0.5か所
  conditions: { band: 1 }
  value: 0.5
  unit: 箇所
  source: { ref: quantity, section: 第4編第3章第2節 2（３）梁2), page: 17 }
  confidence: transcribed
  note: 「梁の長さが、５．０ｍ未満は０．５か所、５．０ｍ以上１０．０ｍ未満は１か所、１０．０ｍ以上は２か所あるものとする」

- key: measure.splice.girder.continuous
  label: 連続する梁の全長にわたる主筋の継手箇所数（5.0m以上10.0m未満）
  expr: 1か所
  conditions: { band: 2 }
  value: 1
  unit: 箇所
  source: { ref: quantity, section: 第4編第3章第2節 2（３）梁2), page: 17 }
  confidence: transcribed
  note: 「梁の長さが、５．０ｍ未満は０．５か所、５．０ｍ以上１０．０ｍ未満は１か所、１０．０ｍ以上は２か所あるものとする」

- key: measure.splice.girder.continuous
  label: 連続する梁の全長にわたる主筋の継手箇所数（10.0m以上）
  expr: 2か所
  conditions: { band: 3 }
  value: 2
  unit: 箇所
  source: { ref: quantity, section: 第4編第3章第2節 2（３）梁2), page: 17 }
