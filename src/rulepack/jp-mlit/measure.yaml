# 公共建築数量積算基準 第4編第3章第2節「鉄筋の計測・計算」— 数量の測り方。
# 配筋詳細（定着・重ね継手・折曲げ・かぶり）は標準仕様書5章の他ファイルが持つ。
# この節は寸法ではなく測り方を定めるので、値は「加算しない／加算する量」になる。

- key: measure.hoop.length.addition
  label: フープ・スタラップの設計長さに加える かぶり控除・フック
  expr: 断面の設計寸法による周長 2×(b＋D) ＋ 0
  conditions: {}
  value: 0
  unit: mm
  source: { ref: quantity, section: 第4編第3章第2節 1通則2), page: 15 }
  confidence: transcribed
  note: 「フープ、スタラップの長さは、それぞれ柱、基礎梁、梁及び壁梁のコンクリートの断面の設計寸法による周長を鉄筋の長さとし、フックはないものとする」— かぶりを控除せず、フック余長も加えない

- key: measure.width-tie.length.addition
  label: 幅止筋の設計長さに加えるフック余長
  expr: コンクリートの設計幅 b ＋ 0
  conditions: {}
  value: 0
  unit: mm
  source: { ref: quantity, section: 第4編第3章第2節 1通則3), page: 15 }
  confidence: transcribed
  note: 「幅止筋の長さは、基礎梁、梁、壁梁、壁のコンクリートの設計幅又は厚さとし、フックはないものとする」— 断面の設計幅そのもので、フック余長を加えない。条項が挙げる部材に柱はないので柱には適用しない

- key: measure.distribution.addition
  label: 割付本数に加える本数
  expr: ⌈その部分の長さ ÷ 鉄筋の間隔⌉ ＋ 1
  conditions: {}
  value: 1
  unit: 本
  source: { ref: quantity, section: 第4編第3章第2節 1通則7), page: 15 }
  confidence: transcribed
  note: 「その部分の長さを鉄筋の間隔で除し、小数点以下第1位を切り上げた整数（同一の部分で間隔の異なる場合はその整数の和）に1を加える」

- key: measure.tip.length.addition
  label: 先端で止まる鉄筋の設計長さに加える定着長さ
  expr: コンクリートの設計寸法 ＋ 0（設計図書指定時のみフック余長）
  conditions: {}
  value: 0
  unit: mm
  source: { ref: quantity, section: 第4編第3章第2節 1通則1), page: 15 }
  confidence: transcribed
  note: 「基礎、柱、梁、床板、壁等の先端で止まる鉄筋は、コンクリートの設計寸法をその部分の鉄筋の長さとし、これに設計図書等で指定された場合はフックの長さを加える」。最上階柱の主筋は２（２）柱1)「最上階柱の主筋については、１通則１）による」によりこの条項の対象 — 定着長さを加えない (R9①)
